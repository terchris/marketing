# The marketing site's workload on UIS. ArgoCD deploys this directory
# (`uis argocd register marketing https://github.com/terchris/marketing`), and the platform adds
# the route itself: HostRegexp(^marketing\..+$), so the same registration answers on
# marketing.localhost and on marketing.urbalurba.com once that name points at the cluster.
#
# The image tag is written by .github/workflows/build-and-push.yaml after every build. Do not
# edit it by hand, and do not use :latest — ArgoCD follows git, not the registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-deployment
  labels:
    app: marketing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marketing
  template:
    metadata:
      labels:
        app: marketing
    spec:
      containers:
        - name: marketing
          image: ghcr.io/terchris/marketing:0ffdb1d-20260928071833
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          # nginx serving files is ready in well under a second; these are not the template's
          # 60–90 s delays, which were sized for a Node server starting up.
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
---
# The first Service in the namespace is the one the platform route points at.
apiVersion: v1
kind: Service
metadata:
  name: marketing-service
spec:
  selector:
    app: marketing
  ports:
    - name: http
      port: 80
      targetPort: 8080
